<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based PC Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='pro-ui-1') }}">
</head>
<body>
    <main class="page-wrap">
        <section class="main-card">
            <header class="hero">
                <div class="hero-icon-wrap">
                    <img src="{{ url_for('static', filename='images/default.svg') }}" alt="PC Builder" class="hero-icon">
                </div>
                <div>
                    <h1 id="titleText">AI-Based PC Builder</h1>
                    <p class="subtitle" id="subtitleText">Smart component selection using BFS, DFS, UCS, and A*</p>
                </div>
            </header>

            <form id="builderForm" class="builder-form">
                <div class="field">
                    <label id="budgetLabel" for="budget">Budget</label>
                    <input type="number" id="budget" min="1" step="0.01" placeholder="Enter budget" required>
                </div>

                <div class="field">
                    <label id="purposeLabel" for="purpose">Purpose</label>
                    <select id="purpose" required>
                        <option value="" disabled selected>Select purpose</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Office / General Use">Office</option>
                        <option value="Content Creation">Content Creation</option>
                        <option value="AI / ML Workstation">ML Workstation</option>
                        <option value="Budget Build">Budget Build</option>
                        <option value="High-End Build">High-End Build</option>
                    </select>
                </div>

                <div class="field">
                    <label id="algorithmLabel" for="algorithm">Algorithm</label>
                    <select id="algorithm" required>
                        <option value="" disabled selected>Select algorithm</option>
                        <option>BFS</option>
                        <option>DFS</option>
                        <option>UCS</option>
                        <option>A*</option>
                    </select>
                </div>

                <div class="field">
                    <label for="currency">Currency</label>
                    <select id="currency">
                        <option value="USD" selected>USD - US Dollar</option>
                        <option value="OMR">OMR - Omani Rial</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="EUR">EUR - Euro</option>
                    </select>
                </div>

                <div class="field">
                    <label for="language">Language</label>
                    <select id="language">
                        <option value="en" selected>English</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

                <button id="searchButton" type="submit">
                    <span class="btn-text" id="searchButtonText">Search Build</span>
                    <span class="spinner hidden" aria-hidden="true"></span>
                </button>
            </form>

            <section class="result-card">
                <h2 id="resultHeading">Result</h2>
                <div id="statusMessage" class="status">Fill the form and run search.</div>
                <div id="resultMeta" class="meta hidden"></div>

                <div id="componentsList" class="components hidden">
                    <table class="components-table">
                        <thead>
                            <tr>
                                <th id="thComponent">Component</th>
                                <th id="thSelected">Selected Item</th>
                                <th id="thPrice">Price</th>
                            </tr>
                        </thead>
                        <tbody id="componentsTableBody"></tbody>
                    </table>

                    <div class="price-summary">
                        <div class="summary-row">
                            <span id="subtotalLabel">Subtotal / Parts Total</span>
                            <strong id="subtotalValue">-</strong>
                        </div>
                        <div class="summary-row total">
                            <span id="totalLabel">Total Price</span>
                            <strong id="totalValue">-</strong>
                        </div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js', v='pro-ui-1') }}"></script>
</body>
</html>
